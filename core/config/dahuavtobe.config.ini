; La section doit porter l'identifiant du plugin : nommée [default], elle serait
; entièrement inerte et chaque config::byKey retomberait sur son défaut codé.
[dahuavtobe]
socketport = 55061
event_heartbeat = 10
reconnect_delay = 15
pulse_duration = 5
snapshot_on_ring = 1
snapshot_on_unlock = 1
snapshot_keep = 50
allow_open_door = 0
open_door_userid = 101
call_history_interval = 15
